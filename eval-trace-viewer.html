<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVAL Trace Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #F7F6F2;
    --surface:  #FFFFFF;
    --border:   #E4E2DB;
    --text:     #1C1B18;
    --text-2:   #6B6860;
    --accent:   #2B5CE6;
    --amber:    #B5722A;
    --success:  #166534;
    --mono:     'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    --sans:     'DM Sans', system-ui, sans-serif;
  }

  html, body {
    height: 100%;
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page { min-height: 100vh; display: flex; flex-direction: column; }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 52px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }

  header h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }

  .legend {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-left: auto;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--text-2);
    font-family: var(--mono);
  }

  .swatch {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .main { flex: 1; padding: 24px; overflow: auto; }

  .trace-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 24px;
    overflow-x: auto;
  }

  #trace {
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.75;
    white-space: pre;
    color: var(--text-2);
  }

  .e   { color: var(--accent); }
  .a   { color: var(--amber);  }
  .r   { color: var(--success);}
  .dim { color: var(--text-2); }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>EVAL Trace</h1>
    <div class="legend">
      <div class="legend-item">
        <div class="swatch" style="background:#2B5CE6"></div>
        E &mdash; expression
      </div>
      <div class="legend-item">
        <div class="swatch" style="background:#B5722A"></div>
        A &mdash; environment
      </div>
      <div class="legend-item">
        <div class="swatch" style="background:#166534"></div>
        result
      </div>
    </div>
  </header>
  <div class="main">
    <div class="trace-box">
      <pre id="trace"></pre>
    </div>
  </div>
</div>
<script>

    EVAL((FF X) ((FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C)))

        EVAL(FF ((FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C)))
        EVAL(FF ((FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C))) → (LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X)))))
          EVAL((COND ((ATOM X) X) (T (FF (CAR X)))) ((X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C)))
              EVAL((ATOM X) ((X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C)))
                  EVAL(X ((X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C)))
                  EVAL(X ((X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C))) → ((A) B C)
              EVAL((ATOM X) ((X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C))) → NIL
                EVAL(T ((X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C)))
                EVAL(T ((X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C))) → T
                EVAL((FF (CAR X)) ((X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C)))
                    EVAL((CAR X) ((X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C)))
                        EVAL(X ((X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C)))
                        EVAL(X ((X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C))) → ((A) B C)
                    EVAL((CAR X) ((X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C))) → (A)
                    EVAL(FF ((X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C)))
                    EVAL(FF ((X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C))) → (LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X)))))
                      EVAL((COND ((ATOM X) X) (T (FF (CAR X)))) ((X A) (X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C)))
                          EVAL((ATOM X) ((X A) (X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C)))
                              EVAL(X ((X A) (X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C)))
                              EVAL(X ((X A) (X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C))) → (A)
                          EVAL((ATOM X) ((X A) (X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C))) → NIL
                            EVAL(T ((X A) (X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C)))
                            EVAL(T ((X A) (X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C))) → T
                            EVAL((FF (CAR X)) ((X A) (X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C)))
                                EVAL((CAR X) ((X A) (X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C)))
                                    EVAL(X ((X A) (X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C)))
                                    EVAL(X ((X A) (X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C))) → (A)
                                EVAL((CAR X) ((X A) (X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C))) → A
                                EVAL(FF ((X A) (X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C)))
                                EVAL(FF ((X A) (X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C))) → (LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X)))))
                                  EVAL((COND ((ATOM X) X) (T (FF (CAR X)))) ((X . A) (X A) (X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C)))
                                      EVAL((ATOM X) ((X . A) (X A) (X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C)))
                                          EVAL(X ((X . A) (X A) (X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C)))
                                          EVAL(X ((X . A) (X A) (X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C))) → A
                                      EVAL((ATOM X) ((X . A) (X A) (X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C))) → T
                                      EVAL(X ((X . A) (X A) (X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C)))
                                      EVAL(X ((X . A) (X A) (X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C))) → A
                                  EVAL((COND ((ATOM X) X) (T (FF (CAR X)))) ((X . A) (X A) (X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C))) → A
                            EVAL((FF (CAR X)) ((X A) (X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C))) → A
                      EVAL((COND ((ATOM X) X) (T (FF (CAR X)))) ((X A) (X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C))) → A
                EVAL((FF (CAR X)) ((X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C))) → A
          EVAL((COND ((ATOM X) X) (T (FF (CAR X)))) ((X (A) B C) (FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C))) → A
    EVAL((FF X) ((FF LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (X (A) B C))) → A
EVAL(((LAMBDA (FF X) (FF X)) (LAMBDA (X) (COND ((ATOM X) X) (T (FF (CAR X))))) (QUOTE ((A) B C))) NIL) → A`;

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function readSexp(s, pos) {
  while (pos < s.length && s[pos] === ' ') pos++;
  if (pos >= s.length) return null;
  if (s[pos] === '(') {
    let depth = 0, start = pos;
    while (pos < s.length) {
      if (s[pos] === '(') depth++;
      else if (s[pos] === ')') { if (--depth === 0) return { end: pos + 1, text: s.slice(start, pos + 1) }; }
      pos++;
    }
    return null;
  }
  let start = pos;
  while (pos < s.length && s[pos] !== ' ' && s[pos] !== ')') pos++;
  return { end: pos, text: s.slice(start, pos) };
}

function parseLine(line) {
  const m = line.match(/^(\s*)EVAL\(/);
  if (!m) return null;
  const indent = m[1];
  let pos = indent.length + 5; // "EVAL("

  const eR = readSexp(line, pos);
  if (!eR) return null;
  pos = eR.end;

  if (line[pos] !== ' ') return null;
  pos++;

  const aR = readSexp(line, pos);
  if (!aR) return null;
  pos = aR.end;

  if (line[pos] !== ')') return null;
  pos++;

  let result = null;
  if (line.slice(pos, pos + 3) === ' → ') result = line.slice(pos + 3);

  return { indent, e: eR.text, a: aR.text, result };
}

function renderLine(line) {
  const p = parseLine(line);
  if (!p) return esc(line);
  let h = esc(p.indent);
  h += `<span class="dim">EVAL(</span>`;
  h += `<span class="e">${esc(p.e)}</span>`;
  h += ` `;
  h += `<span class="a">${esc(p.a)}</span>`;
  h += `<span class="dim">)</span>`;
  if (p.result !== null) {
    h += `<span class="dim"> → </span>`;
    h += `<span class="r">${esc(p.result)}</span>`;
  }
  return h;
}

const lines = TRACE.split('\n').filter(l => l.length > 0);
document.getElementById('trace').innerHTML = lines.map(renderLine).join('\n');
