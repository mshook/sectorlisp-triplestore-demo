<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVAL / APPLY Trace Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F7F6F2;
    --surface: #FFFFFF;
    --border: #E4E2DB;
    --text: #1C1B18;
    --text-2: #6B6860;
    --accent: #2B5CE6;   /* expression / function */
    --violet: #9333A8;   /* APPLY keyword */
    --teal: #0E7C7B;     /* APPLY argument list */
    --amber: #B5722A;    /* environment */
    --success: #166534;  /* result */
    --mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    --sans: 'DM Sans', system-ui, sans-serif;
  }
  html, body {
    height: 100%;
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .page { min-height: 100vh; display: flex; flex-direction: column; }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    min-height: 52px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .meta { font-family: var(--mono); font-size: 11px; color: var(--text-2); }
  .controls { display: flex; align-items: center; gap: 16px; margin-left: auto; flex-wrap: wrap; }
  .legend { display: flex; align-items: center; gap: 16px; }
  .legend-item {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--text-2); font-family: var(--mono);
  }
  .swatch { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .toggles { display: flex; align-items: center; gap: 14px; padding-left: 16px; border-left: 1px solid var(--border); }
  .toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); font-family: var(--mono); cursor: pointer; user-select: none; }
  .toggle input { accent-color: var(--accent); cursor: pointer; }

  .main { flex: 1; padding: 24px; overflow: auto; }
  .trace-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 0;
    overflow-x: auto;
  }
  #trace { font-family: var(--mono); font-size: 13px; line-height: 1.55; white-space: pre; color: var(--text-2); }

  .line {
    padding: 1px 24px 1px 8px;
    border-left: 2px solid transparent;
    margin-left: calc(var(--pad, 0) * 1.3em);
    white-space: pre;
  }
  .line:hover { background: rgba(0,0,0,0.035); }
  .line.k-eval  { border-left-color: rgba(43,92,230,0.30); }
  .line.k-apply { border-left-color: rgba(147,51,168,0.35); }

  .kw { font-weight: 500; }
  .k-eval  .kw { color: var(--accent); }
  .k-apply .kw { color: var(--violet); }
  .line.ret .kw { opacity: 0.5; }   /* returns read quieter than entries */

  .e   { color: var(--accent); }     /* expression (EVAL) / function (APPLY) */
  .args{ color: var(--teal); }       /* evaluated argument list (APPLY) */
  .a   { color: var(--amber); }      /* environment */
  .r   { color: var(--success); font-weight: 500; }
  .dim { color: var(--text-2); }

  body.hide-env .env-wrap { display: none; }
  body.hide-env .env-wrap::after { content: ''; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>EVAL / APPLY Trace</h1>
    <span class="meta" id="counts"></span>
    <div class="controls">
      <div class="legend">
        <div class="legend-item"><div class="swatch" style="background:#2B5CE6"></div>expr / fn</div>
        <div class="legend-item"><div class="swatch" style="background:#0E7C7B"></div>args</div>
        <div class="legend-item"><div class="swatch" style="background:#B5722A"></div>env</div>
        <div class="legend-item"><div class="swatch" style="background:#166534"></div>result</div>
      </div>
      <div class="toggles">
        <label class="toggle"><input type="checkbox" id="nest" checked>nest</label>
        <label class="toggle"><input type="checkbox" id="env" checked>env</label>
      </div>
    </div>
  </header>
  <div class="main">
    <div class="trace-box">
      <div id="trace"></div>
    </div>
  </div>
</div>

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Read one balanced s-expression (atom or parenthesized list) starting at pos.
function readSexp(s, pos) {
  while (pos < s.length && s[pos] === ' ') pos++;
  if (pos >= s.length) return null;
  if (s[pos] === '(') {
    let depth = 0, start = pos;
    while (pos < s.length) {
      if (s[pos] === '(') depth++;
      else if (s[pos] === ')') { if (--depth === 0) return { end: pos + 1, text: s.slice(start, pos + 1) }; }
      pos++;
    }
    return null;
  }
  let start = pos;
  while (pos < s.length && s[pos] !== ' ' && s[pos] !== ')') pos++;
  return { end: pos, text: s.slice(start, pos) };
}

// Parse "EVAL(expr env)" (2 fields) or "APPLY(fn args env)" (3 fields),
// each optionally followed by " → result".
function parseLine(line) {
  const m = line.match(/^(EVAL|APPLY)\(/);
  if (!m) return null;
  const kind = m[1];
  const nfields = kind === 'EVAL' ? 2 : 3;
  let pos = kind.length + 1;
  const fields = [];
  for (let i = 0; i < nfields; i++) {
    const r = readSexp(line, pos);
    if (!r) return null;
    fields.push(r.text);
    pos = r.end;
  }
  while (pos < line.length && line[pos] === ' ') pos++;
  if (line[pos] !== ')') return null;
  pos++;
  let result = null;
  if (line.slice(pos, pos + 3) === ' → ') result = line.slice(pos + 3);
  return { kind, fields, result };
}

function renderRow(p, pad, isReturn) {
  const kc = p.kind === 'EVAL' ? 'k-eval' : 'k-apply';
  let h = `<span class="kw">${p.kind}</span><span class="dim">(</span>`;
  if (p.kind === 'EVAL') {
    h += `<span class="e">${esc(p.fields[0])}</span>`;
    h += `<span class="env-wrap"> <span class="a">${esc(p.fields[1])}</span></span>`;
  } else {
    h += `<span class="e">${esc(p.fields[0])}</span>`;
    h += ` <span class="args">${esc(p.fields[1])}</span>`;
    h += `<span class="env-wrap"> <span class="a">${esc(p.fields[2])}</span></span>`;
  }
  h += `<span class="dim">)</span>`;
  if (isReturn) h += `<span class="dim"> → </span><span class="r">${esc(p.result)}</span>`;
  const ret = isReturn ? ' ret' : '';
  return `<div class="line ${kc}${ret}" style="--pad:${pad}">${h}</div>`;
}

const traceEl = document.getElementById('trace');
const nestEl = document.getElementById('nest');
const envEl = document.getElementById('env');
const lines = TRACE.split('\n').filter(l => l.length > 0);

function render() {
  document.body.classList.toggle('hide-env', !envEl.checked);
  const nest = nestEl.checked;
  let depth = 0, evalN = 0, applyN = 0;
  const out = [];
  for (const line of lines) {
    const p = parseLine(line);
    if (!p) { out.push(`<div class="line">${esc(line)}</div>`); continue; }
    const isReturn = p.result !== null;
    let d;
    if (isReturn) { depth = Math.max(0, depth - 1); d = depth; }
    else { d = depth; depth++; if (p.kind === 'EVAL') evalN++; else applyN++; }
    out.push(renderRow(p, nest ? d : 0, isReturn));
  }
  traceEl.innerHTML = out.join('');
  document.getElementById('counts').textContent =
    `${evalN + applyN} calls · ${evalN} EVAL · ${applyN} APPLY`;
}

nestEl.addEventListener('change', render);
envEl.addEventListener('change', render);
render();
</script>
